<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
        }
        input[type="file"], input[type="number"] {
            padding: 5px;
            margin-top: 5px;
        }
        input[type="submit"] {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload an image to resize and compress by RGB</h1>
        <form action="/resize" method="post" enctype="multipart/form-data">
            <label for="image">Select image:</label>
            <input type="file" id="image" name="image" accept="image/*" required>
            <label for="scale">Scale (0.1 to 1.0):</label>
            <input type="number" id="scale" name="scale" min="0.1" max="1.0" step="0.1" required>
            <label for="r_scale">Red Channel Scale (0.1 to 1.0):</label>
            <input type="number" id="r_scale" name="r_scale" min="0.1" max="1.0" step="0.1" required>
            <label for="g_scale">Green Channel Scale (0.1 to 1.0):</label>
            <input type="number" id="g_scale" name="g_scale" min="0.1" max="1.0" step="0.1" required>
            <label for="b_scale">Blue Channel Scale (0.1 to 1.0):</label>
            <input type="number" id="b_scale" name="b_scale" min="0.1" max="1.0" step="0.1" required>
            <input type="submit" value="Resize and Compress Image">
        </form>
    </div>
</body>
</html>
